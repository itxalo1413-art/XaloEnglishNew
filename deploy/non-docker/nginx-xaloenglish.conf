# Example Nginx site for XaloEnglish (Next.js + NestJS behind reverse proxy)
#
# Adjust:
# - server_name
# - ssl_certificate paths (after certbot) OR remove ssl server block and use certbot --nginx
#
# Assumptions:
# - Frontend listens on 127.0.0.1:3000 (next start)
# - Backend listens on 127.0.0.1:3001 (Nest global prefix /api/v1)
#
# Public URLs:
# - Site: https://YOUR_DOMAIN/
# - API:  https://YOUR_DOMAIN/api/v1/...

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name YOUR_DOMAIN www.YOUR_DOMAIN;

  # Certbot will typically manage redirects; keep this if you manage HTTP manually.
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name YOUR_DOMAIN www.YOUR_DOMAIN;

  # Replace with your real cert paths (certbot usually writes these)
  ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

  # Increase if you upload files through the API (resumes/images)
  client_max_body_size 25m;

  # Next.js (everything except explicit API/static mounts)
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # NestJS API (global prefix /api/v1)
  location /api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Local uploads served by Nest (express.static /uploads)
  location /uploads/ {
    proxy_pass http://127.0.0.1:3001/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
